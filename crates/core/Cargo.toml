[package]
name = "lanwork-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 存储层只引用文件 API（FlushFileBuffers、ReplaceFileW、MoveFileExW）。
# 应用索引另外引用 Shell、COM、注册表和目录变更。
# 文件索引动态加载 Everything SDK，并用 ADO 查询 Windows Search。
# 图标用 IShellItemImageFactory 取 HBITMAP，再用 GDI 读成 RGBA。
# 仍然不引用窗口创建、控件或消息循环。启动时的 SW_SHOWNORMAL 用整数值，不打开 WindowsAndMessaging。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Search",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

[build-dependencies]
sha2 = "0.10.9"

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }
sha2 = "0.10.9"

[[bench]]
name = "match_engine"
harness = false
