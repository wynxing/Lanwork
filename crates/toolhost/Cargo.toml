[package]
name = "lanwork-toolhost"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
mlua = { version = "0.12.2", default-features = false, features = ["lua54", "vendored"] }
rustls = { version = "0.23.23", default-features = false, features = ["ring", "std", "tls12"] }
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
serde_json = "1.0.149"
toml = "0.8.20"
url = "2.5.4"
webpki-roots = "0.26.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

[dev-dependencies]
rcgen = "0.13.2"
