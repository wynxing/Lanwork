[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
    "spikes/hello",
    "spikes/fileidx",
    "spikes/render",
    "spikes/hotcorner",
    "spikes/toast",
    "spikes/ime",
    "spikes/dnd",
    "spikes/urldrop",
    "tools/fixture",
    "tools/sample",
    "tools/shortcut",
    "tools/foreground",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99.0"

[workspace.dependencies]
lanwork-core = { path = "crates/core" }
slint = "=1.18.1"
slint-build = "=1.18.1"
