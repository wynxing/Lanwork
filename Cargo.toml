[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/toolhost",
    "crates/app",
    "spikes/render",
    "spikes/hotcorner",
    "tools/fixture",
    "tools/sample",
    "tools/shortcut",
    "tools/foreground",
    "spikes/toolhost",
    "spikes/apps-page-preview",
]

[workspace.package]
version = "0.5.4"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99.0"

[workspace.dependencies]
lanwork-core = { path = "crates/core" }
slint = "=1.18.1"
slint-build = "=1.18.1"
