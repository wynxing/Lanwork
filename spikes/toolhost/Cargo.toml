[package]
name = "lanwork-toolhost-spike"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
mlua = { version = "0.12.2", default-features = false, features = ["lua54", "vendored"] }
rustls = { version = "0.23.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
slint = { workspace = true, default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "unstable-winit-030",
] }
toml = "0.8.20"
url = "2.5.4"
webpki-roots = "0.26.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
rcgen = "0.13.2"

[build-dependencies]
slint-build.workspace = true
