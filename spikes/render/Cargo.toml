[package]
name = "lanwork-render-spike"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = ["femtovg"]
femtovg = ["slint/renderer-femtovg"]
skia-software = ["slint/renderer-skia"]
skia-opengl = ["slint/renderer-skia-opengl"]
software = ["slint/renderer-software"]

[dependencies]
png = "0.17.16"
raw-window-handle = "0.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
slint = { workspace = true, default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "raw-window-handle-06",
] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build.workspace = true
