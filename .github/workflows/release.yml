name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build and publish
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@v2

      - name: Build installer and portable zip
        shell: pwsh
        run: ./packaging/build.ps1

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content packaging/out/version.txt).Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lanwork ${{ steps.version.outputs.version }}
          body_path: packaging/out/RELEASE.md
          files: |
            packaging/out/Lanwork-Setup-*.exe
            packaging/out/*portable*.zip
          draft: false
          prerelease: false
          make_latest: true
